server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Needed because of the $api variable below: with a
    # literal hostname nginx resolves `api` once, at startup, and caches that IP
    # for the life of the process -- so the first time the API container is
    # recreated (a rebuild, a crash, `compose up -d api`) it comes back on a new
    # IP and every /api/ call 502s until nginx is restarted too. A variable
    # forces re-resolution on the TTL below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Single-origin: the SPA calls /api/... and nginx forwards to the backend.
    # No URI part on proxy_pass: with variables nginx would not rewrite it the
    # usual way, and none is needed -- the upstream path is /api/... as well, so
    # the original request URI is exactly right.
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /openapi.json { proxy_pass $api; }
    location /docs         { proxy_pass $api; }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
