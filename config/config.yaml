# Lead Priority Engine config.
# Override any value with an env var: PE_<SECTION>__<KEY>  (e.g. PE_TRAIN__ALGORITHM=logreg)
# DB credentials come from POSTGRES_* env vars only, never from this file.

csv_path: data/leads.csv
artifacts_dir: artifacts

train:
  # What the training job fits. Names come from features.MODELS, and each one is
  # scored on the validation window with the best PR-AUC registered active.
  #
  # One entry, deliberately. Notebook 03 runs the full comparison -- logistic
  # regression against gradient boosting, a random forest and extra trees -- and
  # the linear model wins it by ~8% PR-AUC, for a reason that is structural
  # rather than incidental: the data has no deep interactions for an ensemble to
  # find. Re-run that notebook when the data changes; until it says otherwise,
  # training three models to throw them away on every run is cost without an
  # answer. Add them back here to see the comparison in the registry.
  candidates: [logreg]
  holdout_days: 28         # August is held out: conversion drops 9.5% -> 7.4% there,
                           # so the split is by time, never random. Scored once,
                           # after the algorithm is already chosen.
  validation_days: 28      # the window before the holdout, used to choose the
                           # algorithm. Selecting on the holdout and then quoting
                           # it as the honest number is selection-on-test; these
                           # are two different jobs, so they get two windows.
  label_maturity_days: 7   # outcomes younger than this aren't known yet
  random_state: 42

predict:
  # No time window to configure: the job derives its own work list from each
  # lead's age against priority.decay_support_minutes (see predict.py). Set an
  # integer to cap rows per run if a backlog needs draining gradually.
  max_rows_per_run: null

priority:
  # Rank by expected value, not raw probability: margin differs ~1.5x across
  # products, so P(buy) alone leaves money on the table.
  #
  # Two regimes, split at the edge of what the model was trained on.
  #
  # INSIDE support (total age <= support_minutes): the model is valid here, so we
  #   ask it rather than approximating. The scoring job advances the lead's clock
  #   features to its current age and re-infers. This window is finite per lead
  #   (6 hours), so the work stops on its own.
  # OUTSIDE support: the model has no evidence at these ages. We anchor on its
  #   answer at the boundary and decay from there with the fitted constant.
  #
  # The two regimes join continuously at the boundary. Note the decay constant
  # was fitted cross-sectionally (one snapshot per lead), so it mixes true
  # cooling with survivor composition and is an UPPER bound on real decay.
  decay_support_minutes: 360
  decay_per_hour: 0.778     # applies only beyond the boundary

  # A call queue only holds leads worth calling, and the horizon is where the
  # decay says calling stops paying. Carrying the anchor scores forward at
  # 0.778/h: by 19.5h of total age the single best lead in the queue is under 1%
  # (and under a tenth of the 9.2% base rate), and by 24h the whole queue is
  # under 0.5%. Everything from there to the old 48h was dead rows occupying a
  # ranked list. So the queue covers 24 hours, and every lead inside it is
  # scored and tiered; past it a lead leaves the queue rather than sitting at
  # the bottom of it forever. Notebook 04, section 5 measures this.
  queue_horizon_hours: 24
  # Hard ceiling on the extrapolated decay: without it an old lead underflows
  # (0.778^3600h is not a representable number) and the ranking breaks. Set to
  # horizon - support so it never binds inside the queue -- raise it with the
  # horizon if the horizon ever grows.
  decay_max_excess_hours: 18
  # Reference clock for "now".
  #   dataset            -> the newest created_at in the data (this file is a
  #                         fixed historical export, so a real clock would put
  #                         every lead months past its support and empty the queue)
  #   null               -> the real wall clock; what production runs on
  #   2026-08-28T23:58Z  -> any explicit instant, for replaying a moment
  # The API reports the resolved value and whether it is pinned, so the dashboard
  # can say so rather than looking stale.
  current_time: dataset
  tiers:                    # percentile cutoffs on expected value
    P1: 95                  # call now
    P2: 80                  # call today
    P3: 50                  # queue
                            # everything below P3 is P4 (deprioritize)

jobs:
  train_cron: "0 3 1 * *"    # 03:00 on the 1st of each month
  predict_cron: "*/5 * * * *"
  run_on_startup: true

api:
  cors_origins: ["http://localhost:8080", "http://localhost:5173"]
